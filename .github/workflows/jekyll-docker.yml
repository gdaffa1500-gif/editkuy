name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]

  # Mengizinkan penjalanan workflow secara manual dari tab Actions
  workflow_dispatch:

# Mengatur permissions GITHUB_TOKEN untuk mengizinkan deployment ke GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Mengizinkan satu deployment simultan saja
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job untuk melakukan Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Build with Jekyll (Docker)
        run: |
          docker run \
          -v ${{ github.workspace }}:/srv/jekyll \
          -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
          jekyll/jekyll:pages \
          jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Job tambahan untuk melakukan Deploy
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
